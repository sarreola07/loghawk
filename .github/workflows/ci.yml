name: CI

# On every push and pull request: run the offline tests, then a Semgrep static
# analysis scan. The tests use a fake model (dependency injection), so they need
# no model server and no API key.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (pytest)
        run: python -m pytest -q

      - name: Static analysis (Semgrep)
        # Reports security findings without running the code. Remove
        # continue-on-error to turn this into a hard security gate that
        # fails the build when Semgrep finds an issue.
        continue-on-error: true
        run: semgrep scan --config auto
